function generic(){let sample=SAMPLE[state.screen];let stored=db.records[state.screen]||[];let description=descriptions[state.screen]||`Manage ${state.screen.toLowerCase()} within ${state.section}.`;let html=header(description,'Add Record','add-record');if(sample){let rows=[...sample[1],...stored.map(r=>sample[0].map((h,i)=>i===0?r.name:i===1?r.value:'Demo'))].filter(r=>r.join(' ').toLowerCase().includes(state.filter.toLowerCase()));if(state.screen==='Import History')rows=db.imports.map(x=>[x.file,x.group,x.valid,x.rejected,x.status]);html+=`<div class="panel">${toolbar()}${table(sample[0].concat('Actions'),rows.map(r=>r.map(x=>safe(x)).concat('<button class="btn" data-action="view-record">View</button>')))}</div>`}else{html+=`<div class="notice">Phase ${safe(MENUS.find(m=>m[0]===state.section)[2].find(x=>x[0]===state.screen)[1])} screen. The interface is interactive demo scaffolding; production behavior requires Laravel services and permissions.</div><div class="grid"><div class="panel"><h2>Configuration</h2>${form('generic',[field('Name','name','text',true),field('Type','value','select',false,['Default','Broadcast','Interactive','Preview','Progressive','Predictive']),field('Description','description','textarea')])}</div><div class="panel"><h2>Operational requirements</h2>${['Role-based access','Audit logging','Server-side validation','Error handling','Integration testing'].map(x=>`<div style="padding:10px;border-bottom:1px solid #edf1f7">✓ ${x}</div>`).join('')}</div></div>`}return html}
function dialer(){return header('Read-only demo: gateway, concurrency and origination controls.')+stats([['AMI','Not connected'],['Channels','0 / 100','Capacity unverified'],['Origination','Disabled'],['Carrier CPS','Unverified']])+`<div class="notice">This standalone prototype never initiates calls. Production emergency stop must be enforced server-side and audited.</div><div class="panel"><h2>Dialer Operations</h2><div class="tools"><button class="btn" data-action="demo">Pause</button><button class="btn" data-action="demo">Resume</button><button class="btn red" data-action="demo">Emergency Stop</button></div></div>`}
function ivr(){return header('Visual representation of an IVR flow and node configuration.')+`<div class="grid"><div class="panel"><h2>IVR Flow Canvas</h2>${['Start','Play Recording','Collect DTMF','Condition: Press 1 or 2','Transfer to Queue / Hangup'].map((x,i)=>`<div class="node">${x}</div>${i<4?'<div class="arrow">↓</div>':''}`).join('')}</div><div class="panel"><h2>Configure Node</h2>${form('generic',[field('Node Name','name','text',true),field('Node Type','value','select',false,['Playback','DTMF','Condition','Transfer','Hangup']),field('Timeout (seconds)','timeout','number'),field('Description','description','textarea')])}</div></div>`}
function agent(){return header('Agent contact workspace and after-call disposition capture.')+`<div class="grid"><div class="panel"><h2>Assigned Contact</h2><p><b>Ama Serwaa</b></p><p>+23324•••4567</p><p>Queue: Sales</p><div class="tools" style="margin-top:18px"><button class="btn" data-action="demo">Preview</button><button class="btn primary" data-action="demo">Dial (demo)</button><button class="btn" data-action="demo">Skip</button></div></div><div class="panel"><h2>Disposition</h2>${form('generic',[field('Outcome','value','select',false,['Interested','Not interested','Callback','No answer','Wrong number']),field('Callback date','date','date'),field('Agent notes','description','textarea')])}</div></div>`}
function report(){return header('Operational KPIs and report filters (illustrative figures).')+stats([['Attempts','1,248'],['Connected','854'],['Answer rate','68.4%'],['Exceptions','12']])+`<div class="grid"><div class="panel"><h2>Performance Trend</h2><div class="bars">${[28,45,38,70,62,85,73,92].map(x=>`<i style="height:${x}%"></i>`).join('')}</div></div><div class="panel"><h2>Report Filters</h2>${form('generic',[field('Campaign','value','select',false,['All campaigns',...db.campaigns.map(x=>x.name)]),field('From date','from','date'),field('To date','to','date')],'Apply Filters')}</div></div>`}
function render(){nav();let s=state.screen;let html=s==='Overview'&&state.section==='Dashboard'?dashboard():s==='Contact Groups'?groupScreen():s==='Contact Directory'?contactScreen():s==='Lists & Imports'?(state.importRows.length?importPreview():importScreen()):s==='All Campaigns'?campaignList():s==='Create / Edit'?campaignWizard():s==='Dialer Control'||s==='Capacity & Rate Limits'?dialer():s==='IVR Flow Builder'?ivr():['Preview Workspace','Progressive Workspace','Wrap-up & Dispositions'].includes(s)?agent():['Campaign Performance','Agent Productivity','Predictive Quality'].includes(s)?report():generic();$('main').innerHTML=html}
function download(filename,text){let url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function newGroup(id){let g=db.groups.find(x=>x.id===id);modal(g?'Edit Contact Group':'Create Contact Group',form('group',[field('Group Name','name','text',true),field('Category','category','select',false,['General','Surveys','Finance','Sales','Marketing']),field('Description','description','textarea')],g?'Save Changes':'Create Group'));let f=$('modalhost').querySelector('form');f.dataset.id=id||'';if(g){f.elements.name.value=g.name;f.elements.category.value=g.category;f.elements.description.value=g.description}}
function newContact(id){let c=db.contacts.find(x=>x.id===id);modal(c?'Edit Contact':'Add Contact',form('contact',[field('Full Name','name','text',true),field('Phone Number','phone','text',true),field('Group','group','select',true,groupOptions()),field('Consent Evidence','consent','select',false,['Unknown','Yes','No'])],c?'Save Changes':'Add Contact'));let f=$('modalhost').querySelector('form');f.dataset.id=id||'';if(c){f.elements.name.value=c.name;f.elements.phone.value=c.phone;f.elements.group.value=c.groups[0]||'';f.elements.consent.value=c.consent}}
function viewGroup(id){let g=db.groups.find(x=>x.id===id);let rows=db.contacts.filter(c=>c.groups.includes(id));modal(g.name+' — Members',`<p>${safe(g.description)} · ${rows.length} contacts</p>${table(['Name','Phone','Consent'],rows.map(c=>[safe(c.name),safe(c.phone),tag(c.consent)]))}<div class="actions"><button class="btn primary" data-action="close">Close</button></div>`)}
document.addEventListener('click',e=>{let go=e.target.closest('[data-go]');if(go){let [a,b]=go.dataset.go.split('|');state.importRows=[];navigate(a,b);return}let ex=e.target.closest('[data-expand]');if(ex){state.expanded=state.expanded===ex.dataset.expand?'':ex.dataset.expand;nav();return}let step=e.target.closest('[data-step]');if(step){state.wizard=+step.dataset.step;render();return}let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=Number(b.dataset.id);if(a==='close'){$('modalhost').innerHTML='';return}if(a==='new-group'){newGroup();return}if(a==='edit-group'){newGroup(id);return}if(a==='view-group'){viewGroup(id);return}if(a==='new-contact'){newContact();return}if(a==='edit-contact'){newContact(id);return}if(a==='delete-contact'){if(confirm('Delete this demo contact?')){db.contacts=db.contacts.filter(x=>x.id!==id);save();render()}return}if(a==='new-campaign'){navigate('Campaigns','Create / Edit');return}if(a==='edit-campaign'){let c=db.campaigns.find(x=>x.id===id);modal('Campaign Details',`<p><b>${safe(c.name)}</b></p><p>Mode: ${safe(c.mode)}</p><p>Status: ${safe(c.status)}</p><p>Progress: ${c.progress}%</p><div class="notice">Demo campaign details; no live dialing.</div>`);return}if(a==='template'){download('gwosevo_contact_template.csv','name,phone,consent\nSample Contact,233241234567,Unknown\n');return}if(a==='back-import'){state.importRows=[];render();return}if(a==='export'){let sample=SAMPLE[state.screen],rows=sample?.[1]||[];if(state.screen==='Contact Groups')rows=db.groups.map(g=>[g.name,g.description,g.category,g.status]);if(state.screen==='Contact Directory')rows=db.contacts.map(c=>[c.name,c.phone,c.groups.join(';'),c.consent]);if(state.screen==='All Campaigns')rows=db.campaigns.map(c=>[c.name,c.mode,c.status,c.progress]);download('gwosevo_'+state.screen.toLowerCase().replace(/[^a-z0-9]+/g,'_')+'.csv',rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'));notify('Demo CSV exported.');return}if(a==='add-record'){modal('Add '+state.screen+' Record',form('generic',[field('Name','name','text',true),field('Value / Type','value'),field('Description','description','textarea')]));return}if(a==='view-record'){notify('Demo record detail. No live system is connected.');return}notify('Demo only: no telephony operation was performed.')});
document.addEventListener('submit',async e=>{let f=e.target;if(!f.dataset.form)return;e.preventDefault();let data=Object.fromEntries(new FormData(f)),kind=f.dataset.form,id=Number(f.dataset.id);if(kind==='group'){let name=String(data.name||'').trim();if(!name)return;if(db.groups.some(g=>g.name.toLowerCase()===name.toLowerCase()&&g.id!==id)){notify('Group name already exists');return}let obj=id?db.groups.find(g=>g.id===id):{id:db.nextId++,status:'Active'};Object.assign(obj,{name,description:data.description||'',category:data.category||'General'});if(!id)db.groups.push(obj);$('modalhost').innerHTML='';save();render();notify('Group saved in this browser');return}if(kind==='contact'){let phone=normalizePhone(data.phone);if(!phone){notify('Invalid Ghana phone number. Use 0XXXXXXXXX, 233XXXXXXXXX or +233XXXXXXXXX.');return}if(db.contacts.some(c=>c.phone===phone&&c.id!==id)){notify('Phone number already exists');return}let obj=id?db.contacts.find(c=>c.id===id):{id:db.nextId++};Object.assign(obj,{name:String(data.name).trim(),phone,groups:[Number(data.group)],consent:data.consent||'Unknown'});if(!id)db.contacts.push(obj);$('modalhost').innerHTML='';save();render();notify('Contact saved in this browser');return}if(kind==='import-prepare'){let file=f.querySelector('[name=file]').files[0];if(!file)return;if(!file.name.toLowerCase().endsWith('.csv')){notify('Standalone import supports CSV only. Convert Excel to CSV first.');return}if(file.size>3*1024*1024){notify('CSV exceeds 3 MB demo limit');return}let rows=csvParse(await file.text());if(rows.length<2){notify('CSV needs a header and at least one data row');return}state.importRows=rows;state.importFile=file.name;state.importGroup=data.group;render();let opts=$('main').querySelectorAll('select');['name','phone','consent'].forEach((key,i)=>{let n=rows[0].findIndex(x=>x.toLowerCase().trim().includes(key));if(n>=0)opts[i].value=String(n)});return}if(kind==='import-commit'){let phoneCol=data.phone,nameCol=data.name,consentCol=data.consent;if(phoneCol===''){notify('Map a phone number column');return}let valid=0,rejected=0;for(let row of state.importRows.slice(1)){let phone=normalizePhone(row[Number(phoneCol)]);if(!phone||db.contacts.some(c=>c.phone===phone)){rejected++;continue}db.contacts.push({id:db.nextId++,name:nameCol!==''?(row[Number(nameCol)]||'Unnamed Contact'):'Unnamed Contact',phone,groups:[Number(state.importGroup)],consent:consentCol!==''&&/^(yes|true|1)$/i.test(row[Number(consentCol)]||'')?'Yes':'Unknown'});valid++}db.imports.unshift({file:state.importFile,group:db.groups.find(g=>g.id===Number(state.importGroup))?.name||'',valid,rejected,status:'Completed'});state.importRows=[];save();navigate('Contacts & Lists','Import History');notify(`Import complete: ${valid} added, ${rejected} rejected or duplicate`);return}if(kind==='campaign-step'){if(state.wizard<5){state.wizard++;render();notify('Wizard step advanced (demo fields are not persisted between steps)')}else{db.campaigns.push({id:db.nextId++,name:'New Campaign '+db.nextId,mode:'Broadcast',status:'Draft',progress:0});save();navigate('Campaigns','All Campaigns');notify('Demo campaign draft created')}return}if(kind==='generic'){let arr=db.records[state.screen]||[];arr.push({name:data.name||'New record',value:data.value||data.mode||'Default'});db.records[state.screen]=arr;save();$('modalhost').innerHTML='';render();notify('Demo record saved locally');return}});
document.addEventListener('input',e=>{if(e.target.id==='globalSearch'){state.global=e.target.value;nav()}if(e.target.id==='filter'){let pos=e.target.selectionStart;state.filter=e.target.value;render();let input=$('filter');if(input){input.focus();input.setSelectionRange(pos,pos)}}});$('hamb').onclick=()=>$('sidebar').classList.toggle('mobileopen');render();
