# Ubuntu 24.04 example. Included inside nginx's http context via sites-enabled.
map $request_uri $gwosevo_loggable {
    default 1;
    ~^/pbx-media/ 0;
}

server {
    listen 85;
    server_name 173.16.254.253;
    root /var/www/gwosevo-voice-broadcast/public;
    index index.php;
    charset utf-8;
    client_max_body_size 12m;
    access_log /var/log/nginx/gwosevo-access.log combined if=$gwosevo_loggable;
    error_log /var/log/nginx/gwosevo-error.log warn;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/gwosevo.sock;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
