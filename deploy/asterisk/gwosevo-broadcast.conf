; Include only through VitalPBX's supported custom dialplan mechanism.
; Never include this context in inbound/public routes. Gateway originates PJSIP only.
[gwosevo-broadcast]
exten => s,1,NoOp(GWO SEVO one-way broadcast)
 same => n,GotoIf($[${REGEX("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" ${VB_ATTEMPT_ID})} != 1]?denied)
 same => n,GotoIf($[${REGEX("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" ${VB_AUDIO_ID})} != 1]?denied)
 same => n,GotoIf($[${REGEX("^[0-9a-f]{64}$" ${VB_TOKEN})} != 1]?denied)
 same => n,GotoIf($[${REGEX("^[0-9a-f]{64}$" ${VB_CHECKSUM})} != 1]?denied)
 same => n,Set(VB_EXPECTED_TOKEN=${DB_DELETE(vb-auth/${VB_ATTEMPT_ID})})
 same => n,GotoIf($["${VB_EXPECTED_TOKEN}" != "${VB_TOKEN}"]?denied)
 same => n,Set(VB_ALLOWED_CHECKSUM=${DB(vb-audio/${VB_AUDIO_ID})})
 same => n,GotoIf($["${VB_ALLOWED_CHECKSUM}" != "${VB_CHECKSUM}"]?failed)
 same => n,GotoIf($[${STAT(e,${ASTDATADIR}/sounds/gwosevo/${VB_AUDIO_ID}.wav)} != 1]?failed)
 same => n,Set(TIMEOUT(absolute)=620)
 same => n,Answer()
 same => n,UserEvent(VBPlaybackStart,AttemptID:${VB_ATTEMPT_ID})
 same => n,Playback(gwosevo/${VB_AUDIO_ID})
 same => n,GotoIf($["${PLAYBACKSTATUS}" != "SUCCESS"]?failed)
 same => n,UserEvent(VBPlaybackComplete,AttemptID:${VB_ATTEMPT_ID})
 same => n,Hangup()
 same => n(failed),UserEvent(VBPlaybackFailed,AttemptID:${VB_ATTEMPT_ID})
 same => n,Hangup()
 same => n(denied),Hangup(21)
