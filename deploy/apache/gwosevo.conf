# Add Listen 85 once in ports.conf. Requires rewrite, proxy, proxy_fcgi and headers.
<VirtualHost *:85>
    ServerName 173.16.254.253
    DocumentRoot /var/www/gwosevo-voice-broadcast/public
    DirectoryIndex index.php
    LimitRequestBody 12582912

    <Directory /var/www/gwosevo-voice-broadcast/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Files "index.php">
        SetHandler "proxy:unix:/run/php/gwosevo.sock|fcgi://localhost/"
    </Files>
    <FilesMatch "^(?!index\.php$).*\.php$">
        Require all denied
    </FilesMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    ErrorLog ${APACHE_LOG_DIR}/gwosevo-error.log
    # Original request is retained through Laravel front-controller rewrites.
    CustomLog ${APACHE_LOG_DIR}/gwosevo-access.log combined "expr=%{THE_REQUEST} !~ m# /pbx-media/#"
</VirtualHost>
